  .card {

    background: var(--yt-bg);
    border-radius: 12px;
    overflow: hidden;
    text-decoration: none;
    color: var(--yt-text);
    display: block;
    border: 1px solid #232323;
    transition: transform .15s ease, border-color .15s ease;
  }
  .card:hover {
    transform: translateY(-2px);
    border-color: #3a3a3a;
  }
 
  .banner {
    height: 140px;
    width: 100%;
    background-size: cover;
    background-position: center;

  .avatar {

    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 28px;
    color: #fff;
    box-shadow: 0 2px 8px rgba(0,0,0,.4);
  }
 
  .meta { flex: 1; min-width: 0; }
 
  .name-row {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 4px;
  }
 
  .name {
    font-size: 22px;
    font-weight: 600;
    margin: 0;
    letter-spacing: .2px;
  }
 
  .check {
    width: 16px;
    height: 16px;
    fill: var(--yt-dim);
  }
 
  .handle-line {
    color: var(--yt-dim);
    font-size: 13px;
    margin: 0 0 6px;
  }
 
  .desc {
    color: var(--yt-dim);
    font-size: 13.5px;
    line-height: 1.4;
    margin: 0 0 8px;
    max-width: 640px;
  }
 
  .links {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    margin-bottom: 12px;
  }
  .links a {
    color: var(--yt-link);
    font-size: 13px;
    text-decoration: none;
  }
  .links a:hover { text-decoration: underline; }
 
  .actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
 
  .btn {
    background: var(--yt-btn);
    color: var(--yt-text);
    border-radius: 18px;
    padding: 9px 16px;
    font-size: 13px;
    font-weight: 500;
    border: none;
    cursor: pointer;
    transition: background .15s ease;
  }
  .btn:hover { background: var(--yt-btn-hover); }
  .btn.primary {
    background: var(--yt-text);
